# Builds, archives, checksums, and a release on this fork for each v* tag.
version: 2

project_name: greenlight

before:
  hooks:
    - go mod tidy

builds:
  - id: greenlight
    main: ./cmd/greenlight
    binary: greenlight
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # Inject the tag into main.version (matches the Makefile's -X main.version).
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: greenlight
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Release only to RandyVentures; never write to upstream or its Homebrew tap.
release:
  github:
    owner: RandyVentures
    name: greenlight

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
